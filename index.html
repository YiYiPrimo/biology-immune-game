<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人体免疫三道防线 · 选词填空对战</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #eef2f7; color: #1f2937; min-height: 100vh;
  }
  .topbar {
    position: sticky; top: 0; z-index: 100; display: flex; align-items: center;
    gap: 14px; flex-wrap: wrap; padding: 10px 18px; background: #fff;
    box-shadow: 0 2px 10px rgba(15,23,42,.08);
  }
  .topbar h1 { font-size: 18px; margin: 0; white-space: nowrap; }
  .hint { font-size: 12px; color: #64748b; flex: 1 1 260px; line-height: 1.5; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .btn-start {
    border: none; background: #2563eb; color: #fff; padding: 9px 20px;
    border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; transition: .15s;
  }
  .btn-start:hover { background: #1d4ed8; transform: translateY(-1px); }
  .btn-start:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-ghost {
    border: 1px solid #cbd5e1; background: #fff; color: #475569; padding: 9px 16px;
    border-radius: 9px; font-size: 14px; cursor: pointer; transition: .15s;
  }
  .btn-ghost:hover { border-color: #94a3b8; background: #f8fafc; }
  #msg { font-size: 14px; font-weight: 700; color: #2563eb; min-width: 170px; text-align: right; }

  .arena { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px; align-items: start; }
  @media (max-width: 1020px) { .arena { grid-template-columns: 1fr; } }

  .board {
    background: #fff; border-radius: 14px; padding: 12px 12px 14px;
    border-top: 6px solid #2563eb; box-shadow: 0 4px 16px rgba(15,23,42,.08);
    transition: box-shadow .25s, border-color .25s;
  }
  .board[data-player="B"] { border-top-color: #ea580c; }
  .board.waiting { opacity: .45; pointer-events: none; filter: blur(1.2px); }
  .board.winner { box-shadow: 0 0 0 3px #facc15, 0 8px 26px rgba(250,204,21,.45); }

  .board-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .name { font-size: 16px; font-weight: 800; }
  .board[data-player="A"] .name { color: #2563eb; }
  .board[data-player="B"] .name { color: #ea580c; }
  .timer {
    font-variant-numeric: tabular-nums; font-size: 21px; font-weight: 800;
    color: #334155; background: #f1f5f9; padding: 2px 14px; border-radius: 9px;
  }
  .timer.stopped { color: #15803d; background: #dcfce7; }

  .pool {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 9px;
    margin-bottom: 10px; background: #f1f5f9; border-radius: 11px; min-height: 62px;
  }
  .word {
    border: 1px solid #cbd5e1; background: #fff; color: #334155;
    border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; transition: .15s;
  }
  .word:hover { border-color: #2563eb; color: #2563eb; transform: translateY(-1px); }
  .word.selected { background: #2563eb; color: #fff; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.22); }
  .board[data-player="B"] .word.selected { background: #ea580c; border-color: #ea580c; box-shadow: 0 0 0 3px rgba(234,88,12,.22); }

  .q { display: flex; gap: 10px; padding: 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 11px; margin-bottom: 8px; }
  .pic {
    width: 150px; height: 108px; flex: none; border-radius: 9px; overflow: hidden;
    background: #0f172a; position: relative;
  }
  .pic svg { display: block; width: 100%; height: 100%; }

  .slots { flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .slot-row { display: flex; align-items: flex-start; gap: 5px; }
  .slot-row .label { flex: none; width: 86px; line-height: 30px; font-size: 13px; font-weight: 700; color: #475569; }
  .slot {
    flex: 1; min-height: 30px; border: 2px dashed #cbd5e1; border-radius: 9px; padding: 2px 5px;
    display: flex; flex-wrap: wrap; gap: 4px; background: #fff; cursor: pointer; align-content: flex-start;
  }
  .slot:hover { border-color: #94a3b8; background: #f8fafc; }
  .slot.ok { border-color: #22c55e; border-style: solid; background: #f0fdf4; }
  .slot.bad { border-color: #ef4444; border-style: solid; background: #fef2f2; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

  .chip {
    background: #dbeafe; color: #1e40af; border-radius: 7px; padding: 3px 8px;
    font-size: 12px; font-weight: 600; cursor: pointer; max-width: 100%; word-break: break-word;
  }
  .chip:hover { background: #bfdbfe; }
  .board[data-player="B"] .chip { background: #ffedd5; color: #9a3412; }
  .board[data-player="B"] .chip:hover { background: #fed7aa; }

  .board-foot { display: flex; align-items: center; gap: 12px; margin-top: 6px; padding-left: 2px; }
  .submit {
    border: none; background: #2563eb; color: #fff; padding: 9px 22px;
    border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; transition: .15s;
  }
  .submit:hover { filter: brightness(1.08); }
  .submit:disabled { opacity: .45; cursor: default; }
  .board[data-player="B"] .submit { background: #ea580c; }
  .result { font-size: 13px; font-weight: 700; }
</style>
</head>

  <div class="hint">提示：点击卡片选中，再点击横线放入；点击已放入的卡片可取出。左右两侧独立作答、独立计时，先做完且全对者获胜。</div>
  <div class="top-actions">
    <button class="btn-start" id="startBtn">开始比赛</button>

    <div id="msg">点击「开始比赛」</div>
  </div>
</div>

    <div class="board-foot">

const ROUNDS = [

    svg: SVG3

const WORDS = ROUNDS.flatMap(r => [...r.lineAnswer, ...r.funcAnswer]);

/* =========================================================
   状态
   ========================================================= */
let gameStarted = false, raceStart = 0, tickTimer = null, cdTimer = null, announced = false, poolOrder = [];
const P = { A: { done: false, time: 0 }, B: { done: false, time: 0 } };
const boards = [document.getElementById('boardA'), document.getElementById('boardB')];
const msg = document.getElementById('msg');

/* =========================================================
   工具函数
   ========================================================= */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* 给 SVG 内 id 加前缀，避免左右两侧 id 冲突 */
function scopeSvg(svg, prefix) {
  return svg
    .replace(/id="([^"]+)"/g, `id="${prefix}-$1"`)
    .replace(/url\(#([^)]+)\)/g, `url(#${prefix}-$1)`)
    .replace(/href="#([^"]+)"/g, `href="#${prefix}-$1"`);
}

/* 构建一个选手面板 */
function buildBoard(p, order) {
  const board = document.getElementById('board' + p);
  const pool = board.querySelector('.pool');
  const qs = board.querySelector('.questions');

  order.forEach(w => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'word'; b.dataset.word = w; b.textContent = w;
    pool.appendChild(b);
  });

  ROUNDS.forEach((r, i) => {
    const q = document.createElement('div');
    q.className = 'q';
    q.innerHTML = `
      <div class="pic">${scopeSvg(r.svg, p + '-' + i)}</div>
      <div class="slots">
        <div class="slot-row">
          <span class="label">${r.lineLabel}</span>
          <div class="slot" data-round="${i}" data-type="line"></div>
        </div>
        <div class="slot-row">
          <span class="label">${r.funcLabel}</span>
          <div class="slot" data-round="${i}" data-type="func"></div>
        </div>
      </div>`;
    qs.appendChild(q);
  });
}

/* =========================================================
   卡片点击：选词 / 放入 / 取出
   ========================================================= */
document.addEventListener('click', (e) => {
  const board = e.target.closest('.board');
  if (!board) return;
  const p = board.dataset.player;
  if (!gameStarted || P[p].done || board.classList.contains('waiting')) return;

  const wordBtn = e.target.closest('.word');
  if (wordBtn) {
    const wasSelected = wordBtn.classList.contains('selected');
    board.querySelectorAll('.word.selected').forEach(x => x.classList.remove('selected'));
    if (!wasSelected) wordBtn.classList.add('selected');
    return;
  }

  const slot = e.target.closest('.slot');
  if (slot) {
    const chip = e.target.closest('.chip');
    if (chip) {
      const back = document.createElement('button');
      back.type = 'button'; back.className = 'word'; back.dataset.word = chip.dataset.word; back.textContent = chip.dataset.word;
      board.querySelector('.pool').appendChild(back);
      chip.remove();
      return;
    }
    const sel = board.querySelector('.word.selected');
    if (!sel) return;
    const c = document.createElement('span');
    c.className = 'chip'; c.dataset.word = sel.dataset.word; c.textContent = sel.dataset.word;
    slot.appendChild(c);
    sel.remove();
    return;
  }

  board.querySelectorAll('.word.selected').forEach(x => x.classList.remove('selected'));
});

/* =========================================================
   提交与判分（两侧独立）
   ========================================================= */
document.querySelectorAll('.submit').forEach(btn => {
  btn.addEventListener('click', () => submitAnswer(btn.closest('.board').dataset.player));
});

function submitAnswer(p) {
  if (!gameStarted || P[p].done) return;
  const board = document.getElementById('board' + p);
  if (board.classList.contains('waiting')) return;

  const res = board.querySelector('.result');
  let allOk = true;

  board.querySelectorAll('.slot').forEach(slot => {
    const ri = +slot.dataset.round;
    const ans = slot.dataset.type === 'line' ? ROUNDS[ri].lineAnswer : ROUNDS[ri].funcAnswer;
    const got = [...slot.querySelectorAll('.chip')].map(c => c.dataset.word);
    const ok = got.length === ans.length && ans.every(w => got.includes(w));
    slot.classList.toggle('ok', ok);
    slot.classList.toggle('bad', !ok);
    if (!ok) allOk = false;
  });

  if (allOk) {
    P[p].done = true;
    P[p].time = (performance.now() - raceStart) / 1000;
    const tEl = board.querySelector('.timer');
    tEl.textContent = P[p].time.toFixed(1) + 's';
    tEl.classList.add('stopped');
    board.querySelector('.submit').disabled = true;
    res.textContent = `✅ 全部正确！用时 ${P[p].time.toFixed(1)}s`;
    res.style.color = '#16a34a';
    if (P.A.done && P.B.done) announceWinner();
  } else {
    res.textContent = '❌ 有错误，请修改后重新提交';
    res.style.color = '#dc2626';
    setTimeout(() => {
      board.querySelectorAll('.slot').forEach(s => s.classList.remove('ok', 'bad'));
      if (res.textContent.indexOf('❌') === 0) res.textContent = '';
    }, 1800);
  }
}

/* =========================================================
   计时与胜负
   ========================================================= */
function updateTimers() {
  if (!gameStarted) return;
  const now = performance.now();
  ['A', 'B'].forEach(p => {
    if (P[p].done) return;
    P[p].time = (now - raceStart) / 1000;
    document.querySelector('#board' + p + ' .timer').textContent = P[p].time.toFixed(1) + 's';
  });
  if (P.A.done && P.B.done) announceWinner();
}

function announceWinner() {
  if (announced) return;
  announced = true;
  clearInterval(tickTimer); tickTimer = null; gameStarted = false;

  const a = P.A.time, b = P.B.time;
  const boardA = document.getElementById('boardA'), boardB = document.getElementById('boardB');

  if (Math.abs(a - b) < 0.05) {
    msg.textContent = `🤝 平局！双方均为 ${a.toFixed(1)}s`;
    boardA.classList.add('winner'); boardB.classList.add('winner');
  } else if (a < b) {
    msg.textContent = `🏆 选手 A 获胜！${a.toFixed(1)}s  vs  ${b.toFixed(1)}s`;
    boardA.classList.add('winner');
  } else {
    msg.textContent = `🏆 选手 B 获胜！${b.toFixed(1)}s  vs  ${a.toFixed(1)}s`;
    boardB.classList.add('winner');
  }
}

/* =========================================================
   重置与开始
   ========================================================= */
function resetAll() {
  clearInterval(tickTimer); clearInterval(cdTimer);
  gameStarted = false; announced = false;
  P.A = { done: false, time: 0 }; P.B = { done: false, time: 0 };
  poolOrder = shuffle([...WORDS]);

  ['A', 'B'].forEach(p => {
    const board = document.getElementById('board' + p);
    board.classList.remove('winner', 'waiting');
    board.querySelector('.pool').innerHTML = '';
    board.querySelector('.questions').innerHTML = '';
    const t = board.querySelector('.timer');
    t.textContent = '0.0s'; t.classList.remove('stopped');
    const r = board.querySelector('.result');
    r.textContent = ''; r.style.color = '';
    board.querySelector('.submit').disabled = false;
    buildBoard(p, poolOrder);
  });
  msg.textContent = '点击「开始比赛」';
}

document.getElementById('startBtn').addEventListener('click', () => {
  if (gameStarted) return;
  resetAll();
  boards.forEach(b => b.classList.add('waiting'));
  let n = 3;
  msg.textContent = '准备… 3';
  cdTimer = setInterval(() => {
    n--;
    if (n > 0) {
      msg.textContent = '准备… ' + n;
    } else {
      clearInterval(cdTimer); cdTimer = null;
      gameStarted = true;
      msg.textContent = '⏱ 比赛进行中…';
      boards.forEach(b => b.classList.remove('waiting'));
      raceStart = performance.now();
      P.A.time = 0; P.B.time = 0;
      tickTimer = setInterval(updateTimers, 80);
      updateTimers();
    }
  }, 800);
});

document.getElementById('resetBtn').addEventListener('click', resetAll);
resetAll();
</script>
